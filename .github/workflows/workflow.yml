name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# The lock is written under a 7-day exclude-newer (the global uv.toml); CI resolves with the same window.
env:
  UV_EXCLUDE_NEWER: 7 days

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
