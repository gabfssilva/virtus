name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.13t", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # onnxruntime, which the pdf extra needs, has no wheel for 3.15 yet.
      - if: ${{ !startsWith(matrix.python, '3.15') }}
        run: uv sync --locked --all-extras && uv run pytest -q
      - if: ${{ startsWith(matrix.python, '3.15') }}
        run: >-
          uv sync --locked --extra anthropic --extra realtime --extra websearch --extra mcp &&
          uv run pytest -q --ignore tests/test_pdf.py --ignore tests/test_knowledge.py
