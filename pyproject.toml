[project]
name = "virtus"
dynamic = ["version"]
description = "A minimal async framework for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Gabriel Francisco", email = "gabfssilva@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "openai>=1.59.6",
    "pydantic>=2.10.5",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.3.0",
]
realtime = [
    "openai[realtime]",
]
websearch = [
    "ddgs>=9.16",
]
mcp = [
    "mcp>=2.3",
]
pdf = [
    "pypdfium2>=4.30",
    "rapidocr>=3",
    "onnxruntime>=1.20",
]

[project.urls]
Repository = "https://github.com/gabfssilva/virtus"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/virtus/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-describe>=2.2",
    "ruff>=0.8",
    "sounddevice>=0.5.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
describe_prefixes = ["describe_", "when_"]
markers = ["integration: calls a real LLM API"]
addopts = "-m 'not integration'"

[tool.pyrefly]
project-includes = ["src", "tests", "examples"]
search-path = ["src", "."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["virtus.tools.net.Net", "virtus.pdfs.Reader", "virtus.lazy.Ranking"]
